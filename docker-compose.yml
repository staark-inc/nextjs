# Staark Next — production stack for a client deployment on a VPS/Docker host.
#
#   docker compose up -d --build
#
# Put a reverse proxy (Caddy/Traefik/nginx) in front for the domain + TLS,
# or add the Caddy service below.

services:
  web:
    build:
      context: .
      dockerfile: apps/starter/Dockerfile
    restart: unless-stopped
    environment:
      # Which theme this client deployment ships.
      STAARK_THEME: ${STAARK_THEME:-webb}
      STAARK_CONTENT_DIR: ${STAARK_CONTENT_DIR:-content/webb}
      STAARK_CONTENT_SOURCE: ${STAARK_CONTENT_SOURCE:-fixtures}

      # Stable deployment identity + release metadata used by the Hub update channel.
      # Leave STAARK_DEPLOYMENT_ID empty to generate/persist one under /data.
      STAARK_DEPLOYMENT_ID: ${STAARK_DEPLOYMENT_ID:-}
      STAARK_UPDATE_CHANNEL: ${STAARK_UPDATE_CHANNEL:-stable}
      STAARK_RELEASE_VERSION: ${STAARK_RELEASE_VERSION:-0.1.0}
      STAARK_RELEASE_ID: ${STAARK_RELEASE_ID:-local}

      # Storage: fs (default, uses the /data volume) or s3 for serverless/portable.
      STAARK_STORAGE: ${STAARK_STORAGE:-fs}
      STAARK_STORAGE_DIR: /data
      # For S3/R2 instead, set STAARK_STORAGE=s3 and:
      # STAARK_S3_BUCKET, STAARK_S3_ENDPOINT, STAARK_S3_ACCESS_KEY_ID, STAARK_S3_SECRET_ACCESS_KEY

      # Local /admin — REQUIRED in production (the app refuses to start admin without them).
      # Existing account = Staark Manager
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}

      # Client account
      ADMIN_CLIENT_USERNAME: ${ADMIN_CLIENT_USERNAME:?set ADMIN_CLIENT_USERNAME}
      ADMIN_CLIENT_PASSWORD: ${ADMIN_CLIENT_PASSWORD:?set ADMIN_CLIENT_PASSWORD}

      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set a 32+ char secret}

      # Optional client capabilities. Example: booking
      # Hub provisioning becomes the source of truth later.
      STAARK_ENTITLEMENTS: ${STAARK_ENTITLEMENTS:-}

      # Safe only while the published port stays loopback-only below.
      STAARK_TRUST_PROXY: ${STAARK_TRUST_PROXY:-1}

      # Submission notification routing. "hub" preserves the existing Hub-owned flow.
      # Use "local" only when this deployment should send notifications itself.
      STAARK_NOTIFICATION_MODE: ${STAARK_NOTIFICATION_MODE:-hub}
      STAARK_NOTIFICATION_TO: ${STAARK_NOTIFICATION_TO:-}
      STAARK_ADMIN_BASE_URL: ${STAARK_ADMIN_BASE_URL:-}

      # Server-side email transport. Disabled until explicitly configured.
      STAARK_MAIL_TRANSPORT: ${STAARK_MAIL_TRANSPORT:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}

      # Public form time-trap secret.
      STAARK_FORM_SECRET: ${STAARK_FORM_SECRET:?set STAARK_FORM_SECRET}
    volumes:
      - staark-data:/data
    ports:
      # Secure default: only the host reverse proxy can reach the app.
      # If STAARK_BIND_HOST=0.0.0.0, also set STAARK_TRUST_PROXY=0.
      - "${STAARK_BIND_HOST:-127.0.0.1}:3000:3000"

  # Uncomment for automatic HTTPS on your domain (edit Caddyfile with your domain).
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   depends_on: [web]
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy-data:/data
  #     - caddy-config:/config

volumes:
  staark-data:
  # caddy-data:
  # caddy-config:
