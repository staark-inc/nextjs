# Staark Next — multi-tenant SaaS runtime
#
# Usage:
#   docker compose --env-file .env.saas up -d --build web
#
# This stack intentionally uses the central SaaS PostgreSQL service
# `staark-postgres` on the external Docker network `staark-network`.
# Do NOT set STAARK_SITE_KEY for SaaS: tenant resolution is hostname-based.

services:
  web:
    build:
      context: .
      dockerfile: apps/starter/Dockerfile
    restart: unless-stopped

    environment:
      NODE_ENV: production

      # Public content/runtime
      STAARK_DATA_SOURCE: postgres
      STAARK_DATA_FALLBACK: none

      # SaaS tenant routing: hostname -> Domain -> Site
      STAARK_SITE_KEY: ""
      STAARK_TENANT_SITE_KEY_FALLBACK: "0"
      STAARK_TRUST_PROXY: "1"

      # Hub -> Next provisioning
      STAARK_PLATFORM_DOMAIN: ${STAARK_PLATFORM_DOMAIN:-staark.app}
      STAARK_PROVISIONING_SECRET: ${STAARK_PROVISIONING_SECRET:-}

      # Central SaaS PostgreSQL on staark-network.
      # Use a dedicated variable name so an old DATABASE_URL from the shell
      # cannot silently point this container at another database.
      DATABASE_URL: ${STAARK_SAAS_DATABASE_URL:?set STAARK_SAAS_DATABASE_URL}

      # Storage
      STAARK_STORAGE: ${STAARK_STORAGE:-fs}
      STAARK_STORAGE_DIR: /data

      # Staark Manager fallback account.
      # SaaS tenant owners are stored in PostgreSQL.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set a 32+ char secret}

      # Legacy client credentials are optional in SaaS mode.
      ADMIN_CLIENT_USERNAME: ${ADMIN_CLIENT_USERNAME:-}
      ADMIN_CLIENT_PASSWORD: ${ADMIN_CLIENT_PASSWORD:-}

      # Deployment/release identity
      STAARK_DEPLOYMENT_ID: ${STAARK_DEPLOYMENT_ID:-}
      STAARK_UPDATE_CHANNEL: ${STAARK_UPDATE_CHANNEL:-stable}
      STAARK_RELEASE_VERSION: ${STAARK_RELEASE_VERSION:-0.1.0}
      STAARK_RELEASE_ID: ${STAARK_RELEASE_ID:-local}

      # Entitlements are normally resolved from Subscription -> Plan.
      STAARK_ENTITLEMENTS: ${STAARK_ENTITLEMENTS:-}

      # Notifications
      STAARK_NOTIFICATION_MODE: ${STAARK_NOTIFICATION_MODE:-hub}
      STAARK_NOTIFICATION_TO: ${STAARK_NOTIFICATION_TO:-}
      STAARK_ADMIN_BASE_URL: ${STAARK_ADMIN_BASE_URL:-}

      # Mail transport
      STAARK_MAIL_TRANSPORT: ${STAARK_MAIL_TRANSPORT:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}

      # Public form anti-bot secret
      STAARK_FORM_SECRET: ${STAARK_FORM_SECRET:?set STAARK_FORM_SECRET}

      # Stripe configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}

      # Cloudflare configuration
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_SAAS_CNAME_TARGET: ${CLOUDFLARE_SAAS_CNAME_TARGET}

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=staark-network"

      # Legacy/internal hostname
      - "traefik.http.routers.staark-next.rule=Host(`next.staarkinc.com`)"
      - "traefik.http.routers.staark-next.entrypoints=web"
      - "traefik.http.routers.staark-next.service=staark-next"

      # SaaS tenant hostnames
      - "traefik.http.routers.staark-saas.rule=HostRegexp(`^[a-z0-9-]+\\.staark\\.app$`)"
      - "traefik.http.routers.staark-saas.entrypoints=web"
      - "traefik.http.routers.staark-saas.service=staark-next"

      # App listens on 3000 inside the container.
      - "traefik.http.services.staark-next.loadbalancer.server.port=3000"

    volumes:
      - staark-data:/data

    networks:
      - staark-network

volumes:
  staark-data:

networks:
  staark-network:
    external: true
