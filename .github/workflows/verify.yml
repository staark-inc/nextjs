name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @staark/starter db:generate
        env:
          DATABASE_URL: postgresql://staark:build-only@127.0.0.1:5432/staark

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
